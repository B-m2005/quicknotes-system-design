<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Your notes, powered by a real API.</p>
    </header>

    <main>
      <section class="controls">
        <button id="load-btn" type="button">Load notes</button>
        <p id="status"></p>
      </section>

      <section class="create">
        <h2>Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title (required, max 100 characters)</label>
          <input
            type="text"
            id="title-input"
            placeholder="Note title..."
            maxlength="100"
          />

          <label for="body-input">Body (optional)</label>
          <textarea
            id="body-input"
            rows="4"
            placeholder="Note body..."
          ></textarea>

          <button type="submit" id="submit-btn">Add Note</button>
        </form>
      </section>

      <section class="notes">
        <h2>Your notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
